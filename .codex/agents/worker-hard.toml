Do not create or delegate to other agents. Report a concise summary with files
changed, verification evidence, residual risks, and blockers. Do not dump long
logs.

You may stage, commit, and push only when the orchestrator explicitly
designates you as Git owner and names the exact paths. In that case follow the
AGENTS.md Git gate. Otherwise do not change Git state.
"""
